<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VectraEdge - Separate Backtest Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-bg { background-color: #131722; border: 1px solid #1e2536; }
  </style>
</head>
<body class="min-h-screen p-4">
  <div class="max-w-md mx-auto space-y-3">
    <div class="flex items-center justify-between border-b border-[#1e2536] pb-3">
      <div>
        <h1 class="text-base font-bold text-white">Backtest + Indicator + Volume</h1>
        <p class="text-[11px] text-slate-400">Separate rule verification view (no mock data)</p>
      </div>
      <a href="index.html" class="px-2.5 py-1 rounded-lg bg-[#131722] border border-[#1e2536] text-xs text-emerald-400">Live UI</a>
    </div>

    <div class="card-bg rounded-xl p-3 space-y-2 text-xs">
      <div class="flex gap-2">
        <input id="sym-input" type="text" value="^NSEI, ^NSEBANK, RELIANCE, HDFCBANK, TCS, INFY, SBIN, TATAMOTORS"
          class="flex-1 bg-[#0b0e14] border border-[#2a3449] rounded-lg px-2.5 py-1.5 text-white" />
        <button onclick="runScanner()" class="px-3 py-1.5 rounded-lg bg-emerald-500 text-black font-bold">Scan</button>
      </div>
      <div class="flex items-center justify-between">
        <label class="flex items-center gap-1.5 text-slate-300">
          <input id="only-passed" type="checkbox" checked onchange="renderList()" />
          <span>Show only PASSED rules</span>
        </label>
        <select id="side-sel" onchange="runScanner()" class="bg-[#0b0e14] border border-[#2a3449] rounded-lg px-2 py-1 text-white">
          <option value="BUY">BUY Rules</option>
          <option value="SELL">SELL Rules</option>
        </select>
      </div>
    </div>

    <div id="status-bar" class="text-[11px] text-slate-400">Ready to scan historical candles.</div>
    <div id="bt-list" class="space-y-2.5"></div>
  </div>

  <script>
    let latestResults = [];

    function calcLocalBacktest(sym, closes, vols, side) {
      const n = closes.length;
      if (n < 15) return { symbol: sym, side, trades_tested: 0, win_rate: 0, vol_ratio: 0, rsi: 50, passed: false };

      const ema = (arr, p) => {
        const k = 2 / (p + 1);
        const out = [arr[0]];
        for (let i = 1; i < arr.length; i++) out.push(arr[i] * k + out[i - 1] * (1 - k));
        return out;
      };
      const rsiArr = (arr, p = 14) => {
        const out = [50];
        let g = [], l = [];
        for (let i = 1; i < arr.length; i++) {
          const d = arr[i] - arr[i - 1];
          g.push(Math.max(0, d));
          l.push(Math.max(0, -d));
          if (i < p) out.push(50);
          else {
            const ag = g.slice(-p).reduce((a, b) => a + b, 0) / p;
            const al = (l.slice(-p).reduce((a, b) => a + b, 0) / p) || 1e-6;
            out.push(Number((100 - 100 / (1 + ag / al)).toFixed(1)));
          }
        }
        return out;
      };

      const e20 = ema(closes, 20);
      const e50 = ema(closes, 50);
      const r14 = rsiArr(closes, 14);
      let wins = 0, tested = 0;

      for (let i = 10; i < n - 1; i++) {
        const vAvg = (vols.slice(Math.max(0, i - 10), i).reduce((a, b) => a + b, 0) / Math.max(1, Math.min(10, i))) || 1;
        const vr = (vols[i] || vAvg) / vAvg;
        const ok = side === 'BUY'
          ? (closes[i] >= e20[i] && e20[i] >= e50[i] * 0.995 && r14[i] >= 50 && vr >= 1.1)
          : (closes[i] <= e20[i] && e20[i] <= e50[i] * 1.005 && r14[i] <= 52 && vr >= 1.1);
        if (ok) {
          tested++;
          const ret = side === 'BUY' ? (closes[i + 1] - closes[i]) : (closes[i] - closes[i + 1]);
          if (ret > 0) wins++;
        }
      }

      const vBase = (vols.slice(-11, -1).reduce((a, b) => a + b, 0) / 10) || 1;
      const volRatio = Number(((vols[n - 1] || vBase) / vBase).toFixed(2));
      const winRate = tested > 0 ? Number(((wins / tested) * 100).toFixed(1)) : 0;
      const ltp = Number(closes[n - 1].toFixed(2));
      const passed = tested >= 2 && winRate >= 60 && volRatio >= 1.05;
      const entry = Number((ltp * (side === 'BUY' ? 1.002 : 0.998)).toFixed(2));
      const target = Number((entry * (side === 'BUY' ? 1.022 : 0.978)).toFixed(2));
      const sl = Number((entry * (side === 'BUY' ? 0.988 : 1.012)).toFixed(2));

      return { symbol: sym, side, ltp, entry, target, sl, trades_tested: tested, win_rate: winRate, vol_ratio: volRatio, rsi: r14[n - 1], passed };
    }

    async function runScanner() {
      const rawSyms = document.getElementById('sym-input').value.split(',').map(s => s.trim()).filter(Boolean);
      const side = document.getElementById('side-sel').value;
      document.getElementById('status-bar').textContent = 'Scanning ' + rawSyms.length + ' symbols...';
      const out = [];

      for (const sym of rawSyms) {
        const ticker = (sym.startsWith('^') || sym.endsWith('.NS')) ? sym : (sym + '.NS');
        try {
          const url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(ticker) + '?interval=1d&range=6mo';
          const res = await fetch(url);
          const json = await res.json();
          const r = json.chart.result[0];
          const q = r.indicators.quote[0];
          const closes = (q.close || []).filter(x => x !== null && x !== undefined);
          const vols = (q.volume || []).filter(x => x !== null && x !== undefined);
          out.push(calcLocalBacktest(sym, closes, vols, side));
        } catch (e) {
          out.push({ symbol: sym, side, trades_tested: 0, win_rate: 0, vol_ratio: 0, rsi: 50, passed: false });
        }
      }

      out.sort((a, b) => (b.passed - a.passed) || (b.win_rate - a.win_rate));
      latestResults = out;
      document.getElementById('status-bar').textContent = 'Scanned ' + out.length + ' symbols.';
      renderList();
    }

    function renderList() {
      const onlyPassed = document.getElementById('only-passed').checked;
      const list = onlyPassed ? latestResults.filter(x => x.passed) : latestResults;
      const box = document.getElementById('bt-list');

      if (!list.length) {
        box.innerHTML = '<div class="card-bg rounded-xl p-4 text-center text-xs text-slate-400">No setups passed all historical indicator + volume rules right now.</div>';
        return;
      }

      box.innerHTML = list.map(item => `
        <div class="card-bg rounded-xl p-3 text-xs space-y-1.5">
          <div class="flex justify-between items-center">
            <span class="font-bold text-white text-sm">${item.symbol}</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${item.passed ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${item.passed ? 'PASSED' : 'FILTERED'}</span>
          </div>
          <div class="flex justify-between text-slate-300">
            <span>BT Win: <strong class="text-emerald-400">${item.win_rate}%</strong> (${item.trades_tested} trades)</span>
            <span>Vol: <strong class="text-cyan-300">${item.vol_ratio}x</strong></span>
            <span>RSI: <strong class="text-amber-300">${item.rsi}</strong></span>
          </div>
          ${item.ltp ? `<div class="flex justify-between text-[11px] text-slate-400 pt-1 border-t border-[#1e2536]">
            <span>LTP: ₹${item.ltp}</span>
            <span>Entry: ₹${item.entry}</span>
            <span class="text-emerald-400">Tgt: ₹${item.target}</span>
            <span class="text-rose-400">SL: ₹${item.sl}</span>
          </div>` : ''}
        </div>
      `).join('');
    }

    runScanner();
  </script>
</body>
</html>
