<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VectraEdge - Smart Trading Signals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .card-bg { background-color: #131722; border: 1px solid #1e2536; }
    .tab-active { border-bottom: 2px solid #10b981; color: #10b981; font-weight: 600; }
    .tab-inactive { color: #94a3b8; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-16 select-none">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-[#0b0e14]/95 backdrop-blur border-b border-[#1e2536] px-4 py-3">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
        <h1 class="text-lg font-bold tracking-tight text-white">Vectra<span class="text-emerald-400">Edge</span></h1>
      </div>
      <div class="flex items-center gap-1.5 text-[11px]">
        <span id="drive-badge" class="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">Drive Sync</span>
        <span id="live-badge" class="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">NSE Live</span>
      </div>
    </div>

    <!-- Open Capital & Risk Input -->
    <div class="max-w-md mx-auto mt-3 grid grid-cols-2 gap-2">
      <div class="bg-[#131722] border border-[#1e2536] rounded-lg px-3 py-1.5">
        <label class="block text-[10px] text-slate-400 uppercase tracking-wider">Capital (₹)</label>
        <input id="capital-input" type="number" value="100000" min="1000" step="1000"
          class="w-full bg-transparent text-white font-semibold text-sm focus:outline-none" onchange="renderAll()" />
      </div>
      <div class="bg-[#131722] border border-[#1e2536] rounded-lg px-3 py-1.5">
        <label class="block text-[10px] text-slate-400 uppercase tracking-wider">Risk / Trade (%)</label>
        <input id="risk-input" type="number" value="2" min="0.5" max="25" step="0.5"
          class="w-full bg-transparent text-white font-semibold text-sm focus:outline-none" onchange="renderAll()" />
      </div>
    </div>

    <!-- Main Segment Tabs -->
    <nav class="max-w-md mx-auto mt-3 grid grid-cols-3 text-center text-xs border-b border-[#1e2536]">
      <button id="tab-fno" onclick="switchTab('fno')" class="py-2.5 tab-active">Options (F&O)</button>
      <button id="tab-stocks" onclick="switchTab('stocks')" class="py-2.5 tab-inactive">Stocks</button>
      <button id="tab-trades" onclick="switchTab('trades')" class="py-2.5 tab-inactive">My Trades (<span id="trade-count">0</span>)</button>
    </nav>
  </header>

  <!-- Sub-Filters for Stocks -->
  <div id="stock-filters" class="hidden max-w-md mx-auto px-4 pt-3 flex gap-2">
    <button onclick="setStockMode('ALL')" id="flt-ALL" class="px-3 py-1 rounded-full text-xs bg-emerald-500 text-black font-semibold">All Stocks</button>
    <button onclick="setStockMode('Intraday')" id="flt-Intraday" class="px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536]">Intraday</button>
    <button onclick="setStockMode('Long/Swing')" id="flt-Long/Swing" class="px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536]">Long / Swing</button>
  </div>

  <!-- Main Content Container -->
  <main class="max-w-md mx-auto px-4 pt-3 space-y-3" id="main-list">
    <div class="text-center py-12 text-slate-400 text-sm">Scanning live NSE & F&O setups...</div>
  </main>

  <!-- Tap-to-Expand Modal (Live Chart + Dual Strategy + Accept Trade) -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center">
    <div class="bg-[#131722] border-t sm:border border-[#2a3449] w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-[#1e2536] pb-3">
        <div>
          <h2 id="modal-title" class="text-base font-bold text-white">NIFTY 24650 CE</h2>
          <p id="modal-sub" class="text-xs text-emerald-400">Profit Chance: 82% | Loss Chance: 18%</p>
        </div>
        <button onclick="closeModal()" class="px-2.5 py-1 rounded-lg bg-[#1e2536] text-slate-300 text-xs">Close ✕</button>
      </div>

      <!-- Simulated Live Candlestick + Indicators Chart -->
      <div class="mt-3 bg-[#0b0e14] rounded-xl p-3 border border-[#1e2536]">
        <div class="flex justify-between text-[10px] text-slate-400 mb-2">
          <span>EMA 20/50 • VWAP • RSI (14) • BB</span>
          <span class="text-emerald-400">15m Live View</span>
        </div>
        <canvas id="signal-chart" height="130" class="w-full"></canvas>
      </div>

      <!-- 1 Lot / Capital P&L Breakdown -->
      <div id="modal-pnl" class="mt-3 grid grid-cols-2 gap-2 text-xs"></div>

      <!-- Dual CE + PE / Multi-Leg Strategy -->
      <div id="modal-legs" class="mt-3 space-y-2"></div>

      <!-- Accept / Log to My Trades -->
      <button id="accept-btn" onclick="acceptCurrentSignal()"
        class="mt-4 w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm transition">
        Accept & Log to My Trades
      </button>
    </div>
  </div>

  <script>
    let allSignals = [];
    let currentTab = 'fno';
    let stockMode = 'ALL';
    let selectedSignal = null;
    let myTrades = JSON.parse(localStorage.getItem('vectra_trades') || '[]');

    async function fetchSignals() {
      try {
        const res = await fetch('/api/signals');
        const data = await res.json();
        allSignals = Array.isArray(data) ? data : (data.signals || data.candidates || []);
      } catch (e) {
        console.error(e);
      }
      renderAll();
    }

    function switchTab(tab) {
      currentTab = tab;
      ['fno', 'stocks', 'trades'].forEach(t => {
        document.getElementById('tab-' + t).className = (t === tab) ? 'py-2.5 tab-active' : 'py-2.5 tab-inactive';
      });
      document.getElementById('stock-filters').classList.toggle('hidden', tab !== 'stocks');
      renderAll();
    }

    function setStockMode(mode) {
      stockMode = mode;
      ['ALL', 'Intraday', 'Long/Swing'].forEach(m => {
        const el = document.getElementById('flt-' + m);
        el.className = (m === mode)
          ? 'px-3 py-1 rounded-full text-xs bg-emerald-500 text-black font-semibold'
          : 'px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536]';
      });
      renderAll();
    }

    function renderAll() {
      document.getElementById('trade-count').textContent = myTrades.length;
      const container = document.getElementById('main-list');
      const capital = parseFloat(document.getElementById('capital-input').value) || 100000;

      if (currentTab === 'trades') {
        if (!myTrades.length) {
          container.innerHTML = `<div class="card-bg rounded-xl p-6 text-center text-slate-400 text-sm">No active trades logged yet. Tap any signal to accept & track live.</div>`;
          return;
        }
        const totalPnl = myTrades.reduce((acc, t) => acc + (t.estPnl || 0), 0);
        container.innerHTML = `
          <div class="card-bg rounded-xl p-3 flex justify-between items-center">
            <span class="text-xs text-slate-400">EOD Projected Net P&L</span>
            <span class="text-base font-bold ${totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${totalPnl >= 0 ? '+' : ''}₹${totalPnl.toLocaleString('en-IN')}</span>
          </div>
          ${myTrades.map((t, idx) => `
            <div class="card-bg rounded-xl p-3.5 space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="font-bold text-white text-sm">${t.cleanName}</span>
                <button onclick="removeTrade(${idx})" class="text-[11px] text-rose-400">Close</button>
              </div>
              <div class="text-xs text-slate-300 flex justify-between">
                <span>Entry: ₹${t.entry}</span>
                <span class="text-emerald-400">Target: ₹${t.target}</span>
                <span class="text-rose-400">SL: ₹${t.sl}</span>
              </div>
            </div>
          `).join('')}
        `;
        return;
      }

      let filtered = allSignals.filter(s => currentTab === 'fno' ? s.is_fno : !s.is_fno);
      if (currentTab === 'stocks' && stockMode !== 'ALL') {
        filtered = filtered.filter(s => (s.symbol || '').includes(stockMode));
      }
      filtered.sort((a, b) => (b.win_prob || 60) - (a.win_prob || 60));

      if (!filtered.length) {
        container.innerHTML = `<div class="card-bg rounded-xl p-6 text-center text-slate-400 text-sm">No high-probability setups in this filter right now.</div>`;
        return;
      }

      container.innerHTML = filtered.map((s, i) => {
        const win = s.win_prob || 68;
        const loss = s.loss_prob || (100 - win);
        const cleanName = (s.symbol || '').split('(')[0].trim();
        const lot = s.lot_size || Math.max(1, Math.floor((capital * 0.25) / (s.ltp || 100)));
        const maxProfit = Math.round(Math.abs((s.target - s.entry) * lot));
        const maxLoss = Math.round(Math.abs((s.entry - s.sl) * lot));
        const legsHtml = (s.multi_leg && s.multi_leg.length)
          ? `<div class="mt-2.5 pt-2 border-t border-[#1e2536] space-y-1 text-[11px]">
              <div class="text-slate-400 font-medium">Dual CE + PE Strategy:</div>
              ${s.multi_leg.map(l => `<div class="flex justify-between text-slate-200"><span>• ${l.action} ${l.type.split('(')[0]}</span><span class="text-emerald-400">${(l.type.match(/Profit \d+% \| Loss \d+%/) || [''])[0]}</span></div>`).join('')}
            </div>`
          : '';

        return `
          <div onclick='openModal(${JSON.stringify(s).replace(/'/g, "&#39;")})' class="card-bg rounded-xl p-3.5 active:scale-[0.99] transition cursor-pointer">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-xs font-bold px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400">#${i + 1}</span>
                  <h3 class="font-bold text-white text-sm">${cleanName}</h3>
                </div>
                <div class="mt-1 flex items-center gap-2 text-xs font-semibold">
                  <span class="text-emerald-400">Profit: ${win}%</span>
                  <span class="text-slate-600">|</span>
                  <span class="text-rose-400">Loss: ${loss}%</span>
                </div>
              </div>
              <div class="text-right">
                <span class="px-2 py-0.5 rounded text-[11px] font-bold ${s.side === 'SELL' ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}">${s.side || 'BUY'}</span>
                <div class="text-xs text-slate-300 mt-1">LTP ₹${s.ltp}</div>
              </div>
            </div>

            <div class="mt-3 grid grid-cols-3 gap-2 bg-[#0b0e14] rounded-lg p-2 text-center text-xs">
              <div><div class="text-[10px] text-slate-400">Entry</div><div class="font-semibold text-white">₹${s.entry}</div></div>
              <div><div class="text-[10px] text-slate-400">Target</div><div class="font-semibold text-emerald-400">₹${s.target}</div></div>
              <div><div class="text-[10px] text-slate-400">Stop Loss</div><div class="font-semibold text-rose-400">₹${s.sl}</div></div>
            </div>

            <div class="mt-2 flex justify-between text-[11px] text-slate-300">
              <span>${s.is_fno ? '1 Lot (' + lot + ')' : 'Qty (' + lot + ')'} Max Profit: <strong class="text-emerald-400">+₹${maxProfit.toLocaleString('en-IN')}</strong></span>
              <span>Max Loss: <strong class="text-rose-400">-₹${maxLoss.toLocaleString('en-IN')}</strong></span>
            </div>
            ${legsHtml}
          </div>
        `;
      }).join('');
    }

    function openModal(s) {
      selectedSignal = s;
      const win = s.win_prob || 68;
      const loss = s.loss_prob || (100 - win);
      document.getElementById('modal-title').textContent = (s.symbol || '').split('(')[0].trim();
      document.getElementById('modal-sub').textContent = `Profit Chance: ${win}% | Loss Chance: ${loss}% • LTP ₹${s.ltp}`;

      const lot = s.lot_size || 1;
      const maxP = Math.round(Math.abs((s.target - s.entry) * lot));
      const maxL = Math.round(Math.abs((s.entry - s.sl) * lot));
      document.getElementById('modal-pnl').innerHTML = `
        <div class="bg-[#0b0e14] p-2.5 rounded-lg border border-[#1e2536]">
          <div class="text-[10px] text-slate-400">1 Lot Max Profit</div>
          <div class="text-sm font-bold text-emerald-400">+₹${maxP.toLocaleString('en-IN')}</div>
        </div>
        <div class="bg-[#0b0e14] p-2.5 rounded-lg border border-[#1e2536]">
          <div class="text-[10px] text-slate-400">1 Lot Max Loss</div>
          <div class="text-sm font-bold text-rose-400">-₹${maxL.toLocaleString('en-IN')}</div>
        </div>
      `;

      document.getElementById('modal-legs').innerHTML = (s.multi_leg && s.multi_leg.length)
        ? s.multi_leg.map(l => `
            <div class="bg-[#0b0e14] p-2.5 rounded-lg border border-[#1e2536] flex justify-between items-center text-xs">
              <div>
                <div class="font-semibold text-white">${l.action} ${l.lots} Lot ${l.type.split('(')[0]}</div>
                <div class="text-[11px] text-emerald-400">${(l.type.match(/Profit \d+% \| Loss \d+%/) || [''])[0]}</div>
              </div>
              <div class="text-right text-[11px]">
                <div class="text-emerald-400">+₹${l.max_leg_pnl}</div>
                <div class="text-rose-400">-₹${Math.abs(l.max_leg_loss)}</div>
              </div>
            </div>
          `).join('')
        : `<div class="bg-[#0b0e14] p-2.5 rounded-lg border border-[#1e2536] text-xs text-slate-300">Direct Equity Setup • Entry ₹${s.entry} | Target ₹${s.target} | SL ₹${s.sl}</div>`;

      document.getElementById('detail-modal').classList.remove('hidden');
      drawChart(s.ltp || 100);
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function acceptCurrentSignal() {
      if (!selectedSignal) return;
      const lot = selectedSignal.lot_size || 1;
      const estPnl = Math.round(Math.abs((selectedSignal.target - selectedSignal.entry) * lot));
      myTrades.unshift({
        cleanName: (selectedSignal.symbol || '').split('(')[0].trim(),
        entry: selectedSignal.entry,
        target: selectedSignal.target,
        sl: selectedSignal.sl,
        estPnl
      });
      localStorage.setItem('vectra_trades', JSON.stringify(myTrades));
      closeModal();
      switchTab('trades');
    }

    function removeTrade(idx) {
      myTrades.splice(idx, 1);
      localStorage.setItem('vectra_trades', JSON.stringify(myTrades));
      renderAll();
    }

    function drawChart(base) {
      const c = document.getElementById('signal-chart');
      const ctx = c.getContext('2d');
      c.width = c.offsetWidth || 320;
      ctx.clearRect(0, 0, c.width, c.height);
      const bars = 24;
      const w = c.width / bars;
      let val = base * 0.985;
      for (let i = 0; i < bars; i++) {
        const delta = (Math.sin(i * 0.7) + (i / bars) * 0.8) * (base * 0.004);
        const open = val;
        const close = val + delta;
        val = close;
        const yOpen = c.height - ((open - base * 0.97) / (base * 0.05)) * c.height;
        const yClose = c.height - ((close - base * 0.97) / (base * 0.05)) * c.height;
        ctx.fillStyle = close >= open ? '#10b981' : '#f43f5e';
        ctx.fillRect(i * w + 3, Math.min(yOpen, yClose), w - 6, Math.max(4, Math.abs(yClose - yOpen)));
      }
    }

    fetchSignals();
    setInterval(fetchSignals, 15000);
  </script>
</body>
</html>
