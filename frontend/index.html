<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VectraEdge - Smart Trading Signals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .card-bg { background-color: #131722; border: 1px solid #1e2536; }
    .tab-active { border-bottom: 2px solid #10b981; color: #10b981; font-weight: 600; }
    .tab-inactive { color: #94a3b8; }
    .subtab-active { background-color: #10b981; color: #0b0e14; font-weight: 700; }
    .subtab-inactive { background-color: #131722; color: #cbd5e1; border: 1px solid #1e2536; }
    @keyframes blinkLiteGreen {
      0%, 100% { background-color: #131722; border-color: rgba(110, 231, 183, 0.55); }
      50% { background-color: rgba(16, 185, 129, 0.16); border-color: #6ee7b7; box-shadow: 0 0 18px rgba(110, 231, 183, 0.35); }
    }
    .strong-blink-green { animation: blinkLiteGreen 1.35s ease-in-out infinite; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-16 select-none">

  <header class="sticky top-0 z-30 bg-[#0b0e14]/95 backdrop-blur border-b border-[#1e2536] px-4 py-3">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div class="flex items-center gap-2">
        <div id="feed-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400"></div>
        <h1 class="text-lg font-bold tracking-tight text-white">Vectra<span class="text-emerald-400">Edge</span></h1>
        <span id="feed-badge" class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30">SYNCING...</span>

        <div class="flex items-center gap-1 ml-1">
          <button id="btn-ring" onclick="toggleRing()" class="relative w-8 h-8 rounded-lg bg-[#131722] border border-[#1e2536] flex items-center justify-center text-emerald-400">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <svg id="ring-slash" class="hidden w-5 h-5 text-rose-400 absolute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="4" y1="20" x2="20" y2="4"></line></svg>
          </button>
          <button id="btn-vib" onclick="toggleVib()" class="relative w-8 h-8 rounded-lg bg-[#131722] border border-[#1e2536] flex items-center justify-center text-emerald-400">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="4" width="10" height="16" rx="2"></rect><path d="M3 8v8"></path><path d="M21 8v8"></path></svg>
            <svg id="vib-slash" class="hidden w-5 h-5 text-rose-400 absolute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="4" y1="20" x2="20" y2="4"></line></svg>
          </button>
        </div>
      </div>

      <div class="text-right leading-tight">
        <div id="live-date" class="text-[11px] font-semibold text-white"></div>
        <div id="live-clock" class="text-[10px] text-emerald-400 font-mono"></div>
      </div>
    </div>

    <div id="index-live-strip" class="max-w-md mx-auto mt-2 space-y-1 text-[10px]"></div>

    <div class="relative max-w-md mx-auto mt-2.5 grid grid-cols-4 gap-1.5 text-xs">
      <button id="cal-btn-year" onclick="openCalPicker('year')" class="bg-[#131722] border border-[#1e2536] text-white rounded-lg px-2 py-1.5 flex items-center justify-between"><span id="lbl-year">Year</span><span class="text-[10px] text-emerald-400">▾</span></button>
      <button id="cal-btn-month" onclick="openCalPicker('month')" class="bg-[#131722] border border-[#1e2536] text-white rounded-lg px-2 py-1.5 flex items-center justify-between"><span id="lbl-month">Month</span><span class="text-[10px] text-emerald-400">▾</span></button>
      <button id="cal-btn-day" onclick="openCalPicker('day')" class="bg-[#131722] border border-[#1e2536] text-white rounded-lg px-2 py-1.5 flex items-center justify-between"><span id="lbl-day">Date</span><span class="text-[10px] text-emerald-400">▾</span></button>
      <button onclick="resetDateFilter()" class="bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 font-semibold rounded-lg px-2 py-1.5">Live All</button>

      <div id="cal-grid-popover" class="hidden absolute left-0 right-0 top-10 z-40 bg-[#131722] border border-[#2a3449] rounded-xl p-3 shadow-2xl">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-[#1e2536]">
          <span id="cal-grid-title" class="text-xs font-bold text-white">Select Date</span>
          <div class="flex items-center gap-2">
            <button onclick="clearCurrentCalField()" class="text-[11px] text-amber-300 font-semibold">Clear</button>
            <button onclick="closeCalPicker()" class="text-[11px] text-slate-400">✕</button>
          </div>
        </div>
        <div id="cal-grid-body" class="grid grid-cols-7 gap-1.5 text-center text-xs"></div>
      </div>
    </div>

    <nav class="max-w-md mx-auto mt-2.5 grid grid-cols-3 text-center text-[11px] border-b border-[#1e2536]">
      <button id="tab-fno" onclick="switchTab('fno')" class="py-2 tab-active flex flex-col items-center justify-center gap-0.5">
        <span>Options (<span id="fno-total">0</span>)</span>
        <span class="text-[10px] font-semibold"><span id="fno-profit" class="text-emerald-400">0</span> <span class="text-slate-600">/</span> <span id="fno-loss" class="text-rose-400">0</span></span>
      </button>
      <button id="tab-stocks" onclick="switchTab('stocks')" class="py-2 tab-inactive flex flex-col items-center justify-center gap-0.5">
        <span>Stocks (<span id="stk-total">0</span>)</span>
        <span class="text-[10px] font-semibold"><span id="stk-profit" class="text-emerald-400">0</span> <span class="text-slate-600">/</span> <span id="stk-loss" class="text-rose-400">0</span></span>
      </button>
      <button id="tab-trades" onclick="switchTab('trades')" class="py-2 tab-inactive flex flex-col items-center justify-center gap-0.5">
        <span>Trades (<span id="trd-total">0</span>)</span>
        <span class="text-[10px] font-semibold"><span id="trd-live" class="text-emerald-400">0</span> <span class="text-slate-600">/</span> <span id="trd-closed" class="text-rose-400">0</span></span>
      </button>
    </nav>
  </header>

  <div id="fno-filters" class="max-w-md mx-auto px-4 pt-3 space-y-2 text-xs">
    <div class="flex gap-1.5 overflow-x-auto">
      <button onclick="setIndexMode('NIFTY')" id="idx-NIFTY" class="py-1.5 px-2.5 rounded-xl subtab-active flex items-center justify-center gap-1 shrink-0"><span>NIFTY</span><span id="best-NIFTY" class="px-1.5 py-0.5 rounded bg-black/25 text-[10px] font-extrabold">--%</span></button>
      <button onclick="setIndexMode('BANKNIFTY')" id="idx-BANKNIFTY" class="py-1.5 px-2.5 rounded-xl subtab-inactive flex items-center justify-center gap-1 shrink-0"><span>BANKNIFTY</span><span id="best-BANKNIFTY" class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 text-[10px] font-extrabold">--%</span></button>
      <button onclick="setIndexMode('SENSEX')" id="idx-SENSEX" class="py-1.5 px-2.5 rounded-xl subtab-inactive flex items-center justify-center gap-1 shrink-0"><span>SENSEX</span><span id="best-SENSEX" class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 text-[10px] font-extrabold">--%</span></button>
      <button onclick="setIndexMode('FINNIFTY')" id="idx-FINNIFTY" class="py-1.5 px-2.5 rounded-xl subtab-inactive flex items-center justify-center gap-1 shrink-0"><span>FINNIFTY</span><span id="best-FINNIFTY" class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 text-[10px] font-extrabold">--%</span></button>
      <button onclick="setIndexMode('MIDCPNIFTY')" id="idx-MIDCPNIFTY" class="py-1.5 px-2.5 rounded-xl subtab-inactive flex items-center justify-center gap-1 shrink-0"><span>MIDCPNIFTY</span><span id="best-MIDCPNIFTY" class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 text-[10px] font-extrabold">--%</span></button>
    </div>
    <div class="flex items-center justify-between gap-1.5 overflow-x-auto">
      <div class="flex gap-1.5 shrink-0">
        <button onclick="setFnoStyle('ALL')" id="fstyle-ALL" class="px-3 py-1 rounded-full text-xs bg-emerald-500 text-black font-semibold">All Scripts</button>
        <button onclick="setFnoStyle('SCALP')" id="fstyle-SCALP" class="px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536]">Scalping ⚡</button>
      </div>
      <div class="flex gap-1 shrink-0">
        <button onclick="setInvestSort('LOW_HIGH')" id="inv-fno-LOW_HIGH" class="px-2 py-1 rounded-lg text-[11px] bg-[#131722] text-slate-300 border border-[#1e2536]">Inv: Low → High</button>
        <button onclick="setInvestSort('HIGH_LOW')" id="inv-fno-HIGH_LOW" class="px-2 py-1 rounded-lg text-[11px] bg-[#131722] text-slate-300 border border-[#1e2536]">Inv: High → Low</button>
      </div>
    </div>
  </div>

  <div id="stock-filters" class="hidden max-w-md mx-auto px-4 pt-3 space-y-2 text-xs">
    <div class="flex gap-1.5 overflow-x-auto">
      <button onclick="setStockMode('ALL')" id="flt-ALL" class="px-3 py-1 rounded-full text-xs bg-emerald-500 text-black font-semibold shrink-0">All Stocks</button>
      <button onclick="setStockMode('Intraday')" id="flt-Intraday" class="px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536] shrink-0">Intraday</button>
      <button onclick="setStockMode('Long/Swing')" id="flt-Long/Swing" class="px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536] shrink-0">Long / Swing</button>
      <button onclick="setStockMode('SCALP')" id="flt-SCALP" class="px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536] shrink-0">Scalping ⚡</button>
    </div>
  </div>

  <main id="swipe-area" class="max-w-md mx-auto px-4 pt-3 space-y-3 min-h-[65vh]">
    <div id="main-list" class="space-y-3">
      <div class="text-center py-12 text-slate-400 text-sm">Loading Upstox live market data...</div>
    </div>
  </main>

  <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center">
    <div class="bg-[#131722] border-t sm:border border-[#2a3449] w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-[#1e2536] pb-3">
        <div>
          <h2 id="modal-title" class="text-base font-bold text-white">NIFTY</h2>
          <p id="modal-sub" class="text-xs text-emerald-400">Live Upstox Quote</p>
        </div>
        <button onclick="closeModal()" class="px-2.5 py-1 rounded-lg bg-[#1e2536] text-slate-300 text-xs">Close</button>
      </div>
      <div id="modal-ai-box" class="mt-3 bg-indigo-500/10 border border-indigo-400/30 rounded-xl p-2.5 text-[11px] text-indigo-200"></div>
      <div id="modal-lot-box" class="mt-3 bg-[#0b0e14] p-3 rounded-xl border border-[#1e2536] flex items-center justify-between gap-2 text-xs"></div>
      <div id="modal-pnl" class="mt-3 grid grid-cols-2 gap-2 text-xs"></div>
      <button onclick="acceptCurrentSignal()" class="mt-4 w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm transition">
        Accept and Log to My Trades
      </button>
    </div>
  </div>

  <script>
    const TABS = ['fno', 'stocks', 'trades'];
    const INDEX_TABS = ['NIFTY', 'BANKNIFTY', 'SENSEX', 'FINNIFTY', 'MIDCPNIFTY'];
    const INDEX_META = {
      NIFTY: { spot: 25546.20, prevClose: 25387.40, step: 50, lot: 75 },
      BANKNIFTY: { spot: 63389.90, prevClose: 62273.25, step: 100, lot: 30 },
      SENSEX: { spot: 83087.90, prevClose: 81040.00, step: 100, lot: 20 },
      FINNIFTY: { spot: 28370.75, prevClose: 28015.40, step: 50, lot: 65 },
      MIDCPNIFTY: { spot: 17777.45, prevClose: 14254.50, step: 25, lot: 120 }
    };

    let allSignals = [];
    let currentTab = 'fno';
    let indexMode = 'NIFTY';
    let fnoStyle = 'ALL';
    let stockMode = 'ALL';
    let investSort = 'NONE';
    let selectedSignal = null;
    let qtyMap = {};
    let myTrades = JSON.parse(localStorage.getItem('vectra_trades') || '[]').map(t => Object.assign({ status: 'LIVE' }, t));

    let selYear = 'ALL', selMonth = 'ALL', selDay = 'ALL', activeCalType = null;
    let ringEnabled = JSON.parse(localStorage.getItem('vectra_ring_on') ?? 'true');
    let vibEnabled = JSON.parse(localStorage.getItem('vectra_vib_on') ?? 'true');

    function getSigKey(s) { return (s.symbol || 'SIG') + '|' + (s.date || ''); }
    function getUnits(s) { return Math.max(1, parseInt(qtyMap[getSigKey(s)] || 1, 10) || 1); }

    function changeUnits(e, key, delta) {
      if (e) e.stopPropagation();
      qtyMap[key] = Math.max(1, (parseInt(qtyMap[key] || 1, 10) || 1) + delta);
      renderAll();
      if (selectedSignal && getSigKey(selectedSignal) === key) refreshModalDynamic(selectedSignal);
    }

    function setUnitsDirect(e, key, val) {
      if (e) e.stopPropagation();
      qtyMap[key] = Math.max(1, parseInt(val || 1, 10) || 1);
      renderAll();
      if (selectedSignal && getSigKey(selectedSignal) === key) refreshModalDynamic(selectedSignal);
    }

    function computeLiveLevels(s, totalQty) {
      const ltp = parseFloat(s.ltp) || 0;
      if (!ltp) return { hasPrice: false, ltp: null, entry: null, target: null, sl: null, livePnl: 0, maxProfit: 0, maxLoss: 0 };
      const isSell = (s.side || 'BUY').toUpperCase() === 'SELL';
      const isScalp = Boolean(s.is_scalp);
      const entry = Number((ltp * (isSell ? 0.998 : 1.002)).toFixed(2));
      const tPct = isScalp ? 0.08 : (s.is_fno ? 0.22 : 0.025);
      const slPct = isScalp ? 0.05 : (s.is_fno ? 0.11 : 0.013);
      const target = isSell ? Number((entry * (1 - tPct)).toFixed(2)) : Number((entry * (1 + tPct)).toFixed(2));
      const sl = isSell ? Number((entry * (1 + slPct)).toFixed(2)) : Number((entry * (1 - slPct)).toFixed(2));
      const livePnl = Math.round(isSell ? (entry - ltp) * totalQty : (ltp - entry) * totalQty);
      const maxProfit = Math.round(Math.abs((target - entry) * totalQty));
      const maxLoss = Math.round(Math.abs((entry - sl) * totalQty));
      return { hasPrice: true, ltp, entry, target, sl, livePnl, maxProfit, maxLoss };
    }

    function makeIndexTileHtml(idxName, spots) {
      const baseMeta = INDEX_META[idxName];
      const curMeta = spots[idxName] || baseMeta;
      const price = Number((curMeta.spot || baseMeta.spot).toFixed(2));
      const prev = Number((curMeta.prevClose || baseMeta.prevClose || price).toFixed(2));
      const pts = Number((price - prev).toFixed(2));
      const pct = prev !== 0 ? Number(((pts / prev) * 100).toFixed(2)) : 0;
      const isPos = pts >= 0;
      const sign = isPos ? '+' : '';
      return '<div class="bg-[#131722] border border-[#1e2536] rounded-lg px-2 py-1 flex items-center justify-between gap-1">' +
        '<span class="font-bold text-white">' + idxName + '</span>' +
        '<span class="font-mono text-slate-200">' + price.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</span>' +
        '<span class="font-mono font-semibold ' + (isPos ? 'text-emerald-400' : 'text-rose-400') + '">' + sign + pts.toFixed(2) + ' (' + sign + pct.toFixed(2) + '%)</span>' +
      '</div>';
    }

    function renderIndexLiveStrip(spotsOverride) {
      const strip = document.getElementById('index-live-strip');
      if (!strip) return;
      const spots = spotsOverride || INDEX_META;
      strip.innerHTML =
        '<div class="grid grid-cols-2 gap-1">' + makeIndexTileHtml('NIFTY', spots) + makeIndexTileHtml('BANKNIFTY', spots) + '</div>' +
        '<div class="grid grid-cols-2 gap-1">' + makeIndexTileHtml('SENSEX', spots) + makeIndexTileHtml('FINNIFTY', spots) + '</div>' +
        '<div class="grid grid-cols-1">' + makeIndexTileHtml('MIDCPNIFTY', spots) + '</div>';
    }

    function detectIndexName(sym) {
      const u = (sym || '').toUpperCase().trim();
      if (u.startsWith('BANKNIFTY')) return 'BANKNIFTY';
      if (u.startsWith('MIDCPNIFTY')) return 'MIDCPNIFTY';
      if (u.startsWith('FINNIFTY')) return 'FINNIFTY';
      if (u.startsWith('SENSEX')) return 'SENSEX';
      if (u.startsWith('NIFTY')) return 'NIFTY';
      return null;
    }

    async function fetchAllLive() {
      const badge = document.getElementById('feed-badge');
      const dot = document.getElementById('feed-dot');
      try {
        const [upRes, sigRes] = await Promise.all([
          fetch('/api/upstox/live').then(r => r.json()).catch(() => ({ connected: false, spots: {}, options: [] })),
          fetch('/api/signals').then(r => r.json()).catch(() => ({ signals: [] }))
        ]);

        if (upRes.connected) {
          badge.textContent = 'UPSTOX LIVE';
          badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
          dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';
        } else {
          badge.textContent = 'CHECK BACKEND';
          badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30';
        }

        if (upRes.spots && Object.keys(upRes.spots).length) {
          renderIndexLiveStrip(upRes.spots);
        }

        const liveOpts = (upRes.options || []).map(o => Object.assign({
          date: window._todayKey,
          index_name: detectIndexName(o.symbol)
        }, o));

        const scalpOpts = liveOpts.slice(0, 60).map(o => Object.assign({}, o, {
          symbol: o.symbol + ' [SCALP]',
          is_scalp: true
        }));

        const rawStocks = (Array.isArray(sigRes) ? sigRes : (sigRes.signals || [])).filter(x => !detectIndexName(x.symbol));
        const stocksNorm = rawStocks.map(st => Object.assign({
          date: window._todayKey,
          is_fno: false,
          is_scalp: Boolean((st.symbol || '').toUpperCase().includes('SCALP')),
          side: st.side || 'BUY',
          ltp: parseFloat(st.ltp) || 100,
          win_prob: parseInt(st.win_prob || 68, 10),
          backtest_win_rate: parseInt(st.backtest_win_rate || st.win_prob || 66, 10),
          vol_ratio: parseFloat(st.vol_ratio || 1.2),
          lot_size: 1
        }, st));

        allSignals = liveOpts.concat(scalpOpts).concat(stocksNorm);
      } catch (e) {
        console.error(e);
      }
      renderAll();
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('live-date').textContent = now.toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
      document.getElementById('live-clock').textContent = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    function initCalendarState() {
      const now = new Date();
      window._todayKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    }

    function openCalPicker(type) { closeCalPicker(); }
    function closeCalPicker() { document.getElementById('cal-grid-popover').classList.add('hidden'); }
    function resetDateFilter() { selYear = 'ALL'; selMonth = 'ALL'; selDay = 'ALL'; renderAll(); }
    function toggleRing() { ringEnabled = !ringEnabled; document.getElementById('ring-slash').classList.toggle('hidden', ringEnabled); }
    function toggleVib() { vibEnabled = !vibEnabled; document.getElementById('vib-slash').classList.toggle('hidden', vibEnabled); }

    function switchTab(tab) {
      currentTab = tab;
      TABS.forEach(t => {
        document.getElementById('tab-' + t).className = (t === tab)
          ? 'py-2 tab-active flex flex-col items-center justify-center gap-0.5'
          : 'py-2 tab-inactive flex flex-col items-center justify-center gap-0.5';
      });
      document.getElementById('fno-filters').classList.toggle('hidden', tab !== 'fno');
      document.getElementById('stock-filters').classList.toggle('hidden', tab !== 'stocks');
      renderAll();
    }

    function setIndexMode(idxName) {
      indexMode = idxName;
      INDEX_TABS.forEach(name => {
        const active = (name === idxName);
        document.getElementById('idx-' + name).className = 'py-1.5 px-2.5 rounded-xl flex items-center justify-center gap-1 shrink-0 ' + (active ? 'subtab-active' : 'subtab-inactive');
      });
      renderAll();
    }

    function setFnoStyle(st) {
      fnoStyle = st;
      ['ALL', 'SCALP'].forEach(x => {
        document.getElementById('fstyle-' + x).className = (x === st)
          ? 'px-3 py-1 rounded-full text-xs bg-emerald-500 text-black font-semibold'
          : 'px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536]';
      });
      renderAll();
    }

    function setStockMode(m) { stockMode = m; renderAll(); }
    function setInvestSort(m) { investSort = (investSort === m) ? 'NONE' : m; renderAll(); }

    function renderAll() {
      const fnoAll = allSignals.filter(s => s.is_fno && !s.is_scalp);
      const stkAll = allSignals.filter(s => !s.is_fno && !s.is_scalp);

      INDEX_TABS.forEach(name => {
        const items = fnoAll.filter(x => (x.index_name || detectIndexName(x.symbol)) === name);
        document.getElementById('best-' + name).textContent = items.length ? (Math.max.apply(null, items.map(x => x.win_prob || 0)) + '%') : '--%';
      });

      document.getElementById('fno-total').textContent = fnoAll.length;
      document.getElementById('fno-profit').textContent = fnoAll.filter(x => (x.win_prob || 0) >= 50).length;
      document.getElementById('fno-loss').textContent = fnoAll.filter(x => (x.win_prob || 0) < 50).length;

      document.getElementById('stk-total').textContent = stkAll.length;
      document.getElementById('stk-profit').textContent = stkAll.filter(x => (x.win_prob || 0) >= 50).length;
      document.getElementById('stk-loss').textContent = stkAll.filter(x => (x.win_prob || 0) < 50).length;

      document.getElementById('trd-total').textContent = myTrades.length;
      document.getElementById('trd-live').textContent = myTrades.filter(t => t.status !== 'CLOSED').length;
      document.getElementById('trd-closed').textContent = myTrades.filter(t => t.status === 'CLOSED').length;

      const container = document.getElementById('main-list');
      if (currentTab === 'trades') {
        container.innerHTML = myTrades.length
          ? myTrades.map((t, idx) => '<div class="card-bg rounded-xl p-3.5"><div class="flex justify-between"><span class="font-bold text-white text-sm">' + t.cleanName + '</span><span class="text-xs text-emerald-400">Entry ₹' + t.entry + '</span></div></div>').join('')
          : '<div class="card-bg rounded-xl p-6 text-center text-slate-400 text-sm">No trades logged yet.</div>';
        return;
      }

      let list = (currentTab === 'fno')
        ? allSignals.filter(s => s.is_fno && (s.index_name || detectIndexName(s.symbol)) === indexMode && (fnoStyle === 'SCALP' ? s.is_scalp : !s.is_scalp))
        : allSignals.filter(s => !s.is_fno);

      list = list.sort((a, b) => (b.win_prob || 0) - (a.win_prob || 0));

      if (!list.length) {
        container.innerHTML = '<div class="card-bg rounded-xl p-6 text-center text-slate-400 text-sm">Fetching live Upstox option chain... Make sure backend server is running.</div>';
        return;
      }

      const topProb = Math.max.apply(null, list.map(x => x.win_prob || 0));

      container.innerHTML = list.map((s, i) => {
        const key = getSigKey(s);
        const units = getUnits(s);
        const totalQty = units * (s.is_fno ? (s.lot_size || 75) : 1);
        const lv = computeLiveLevels(s, totalQty);
        const investAmt = Math.round(totalQty * (lv.entry || 0));
        const win = s.win_prob || 68;
        const isStrongTop = (win === topProb && win >= 75);
        const cleanName = (s.symbol || '').split('(')[0].trim();
        const aiText = s.ai_suggestion || ('AI PICK (' + win + '/100) • Entry ₹' + lv.entry + ' → Exit Tgt ₹' + lv.target + ' / SL ₹' + lv.sl);

        return '<div onclick=\'openModal(' + JSON.stringify(s).replace(/'/g, "&#39;") + ')\' class="card-bg rounded-xl p-3.5 cursor-pointer ' + (isStrongTop ? 'strong-blink-green' : '') + '">' +
          '<div class="flex items-start justify-between gap-2">' +
            '<div>' +
              '<div class="flex items-center gap-1.5 flex-wrap">' +
                '<span class="text-xs font-bold px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400">#' + (i + 1) + '</span>' +
                '<h3 class="font-bold text-white text-sm">' + cleanName + '</h3>' +
                (isStrongTop ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold bg-emerald-300/25 text-emerald-200">STRONGEST</span>' : '') +
              '</div>' +
              '<div class="mt-1 flex items-center gap-2 text-xs font-semibold">' +
                '<span class="text-emerald-400">Profit: ' + win + '% (+₹' + lv.maxProfit.toLocaleString('en-IN') + ')</span>' +
                '<span class="text-slate-600">|</span>' +
                '<span class="text-rose-400">Loss: ' + (100 - win) + '% (-₹' + lv.maxLoss.toLocaleString('en-IN') + ')</span>' +
              '</div>' +
              '<div class="mt-1 flex items-center gap-2 text-[10px] text-cyan-300 font-semibold">' +
                '<span>BT Win: ' + (s.backtest_win_rate || win) + '%</span><span>•</span><span>Vol: ' + (s.vol_ratio || 1.2) + 'x</span>' +
                (s.oi ? '<span>•</span><span>OI: ' + Number(s.oi).toLocaleString('en-IN') + '</span>' : '') +
              '</div>' +
            '</div>' +
            '<div class="text-right">' +
              '<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-500/20 text-emerald-400">' + s.side + '</span>' +
              '<div class="text-xs text-emerald-300 font-mono font-bold mt-1">LTP ₹' + lv.ltp + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="mt-2 bg-indigo-500/10 border border-indigo-400/25 rounded-lg px-2.5 py-1.5 text-[10px] text-indigo-200">' + aiText + '</div>' +
          '<div class="mt-2.5 grid grid-cols-3 gap-2 bg-[#0b0e14] rounded-lg p-2 text-center text-xs">' +
            '<div><div class="text-[10px] text-slate-400">Live Entry</div><div class="font-semibold text-white">₹' + lv.entry + '</div></div>' +
            '<div><div class="text-[10px] text-slate-400">Exit Target</div><div class="font-semibold text-emerald-400">₹' + lv.target + '</div></div>' +
            '<div><div class="text-[10px] text-slate-400">Exit SL</div><div class="font-semibold text-rose-400">₹' + lv.sl + '</div></div>' +
          '</div>' +
          '<div onclick="event.stopPropagation()" class="mt-2.5 flex items-center justify-between gap-2 bg-[#0b0e14] rounded-lg px-2.5 py-2 border border-[#1e2536] text-xs">' +
            '<div class="flex items-center gap-1.5">' +
              '<span class="text-slate-400 text-[11px]">' + (s.is_fno ? 'Lots:' : 'Qty:') + '</span>' +
              '<button onclick="changeUnits(event, \'' + key.replace(/'/g, "\\'") + '\', -1)" class="w-6 h-6 rounded bg-[#1e2536] text-white font-bold">-</button>' +
              '<input type="number" min="1" value="' + units + '" onchange="setUnitsDirect(event, \'' + key.replace(/'/g, "\\'") + '\', this.value)" class="w-11 text-center bg-[#131722] border border-[#2a3449] rounded py-0.5 text-white font-bold" />' +
              '<button onclick="changeUnits(event, \'' + key.replace(/'/g, "\\'") + '\', 1)" class="w-6 h-6 rounded bg-emerald-500/20 text-emerald-400 font-bold">+</button>' +
            '</div>' +
            '<div class="text-right">' +
              '<div class="text-[10px] text-slate-400">Investment (' + totalQty + ' qty)</div>' +
              '<div class="font-bold text-amber-300">₹' + investAmt.toLocaleString('en-IN') + '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function refreshModalDynamic(s) {
      const units = getUnits(s);
      const totalQty = units * (s.is_fno ? (s.lot_size || 75) : 1);
      const lv = computeLiveLevels(s, totalQty);
      document.getElementById('modal-sub').textContent = 'Upstox Live LTP ₹' + lv.ltp + ' • Entry ₹' + lv.entry + ' • Tgt ₹' + lv.target;
      document.getElementById('modal-ai-box').textContent = s.ai_suggestion || ('Entry ₹' + lv.entry + ' → Exit Tgt ₹' + lv.target + ' / SL ₹' + lv.sl);
      document.getElementById('modal-pnl').innerHTML =
        '<div class="bg-[#0b0e14] p-2.5 rounded-lg border border-[#1e2536]"><div class="text-[10px] text-slate-400">Max Profit</div><div class="text-sm font-bold text-emerald-400">+₹' + lv.maxProfit.toLocaleString('en-IN') + '</div></div>' +
        '<div class="bg-[#0b0e14] p-2.5 rounded-lg border border-[#1e2536]"><div class="text-[10px] text-slate-400">Max Loss</div><div class="text-sm font-bold text-rose-400">-₹' + lv.maxLoss.toLocaleString('en-IN') + '</div></div>';
    }

    function openModal(s) {
      selectedSignal = s;
      document.getElementById('modal-title').textContent = (s.symbol || '').split('(')[0].trim();
      refreshModalDynamic(s);
      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }

    function acceptCurrentSignal() {
      if (!selectedSignal) return;
      const units = getUnits(selectedSignal);
      const totalQty = units * (selectedSignal.is_fno ? (selectedSignal.lot_size || 75) : 1);
      const lv = computeLiveLevels(selectedSignal, totalQty);
      myTrades.unshift({ cleanName: (selectedSignal.symbol || '').split('(')[0].trim(), entry: lv.entry, target: lv.target, sl: lv.sl, status: 'LIVE' });
      localStorage.setItem('vectra_trades', JSON.stringify(myTrades));
      closeModal();
      switchTab('trades');
    }

    initCalendarState();
    renderIndexLiveStrip();
    fetchAllLive();
    setInterval(fetchAllLive, 5000);
  </script>
</body>
</html>
