<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VectraEdge - Smart Trading Signals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .card-bg { background-color: #131722; border: 1px solid #1e2536; }
    .tab-active { border-bottom: 2px solid #10b981; color: #10b981; font-weight: 600; }
    .tab-inactive { color: #94a3b8; }
    .subtab-active { background-color: #10b981; color: #0b0e14; font-weight: 700; }
    .subtab-inactive { background-color: #131722; color: #cbd5e1; border: 1px solid #1e2536; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-16 select-none">

  <header class="sticky top-0 z-30 bg-[#0b0e14]/95 backdrop-blur border-b border-[#1e2536] px-4 py-3">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
        <h1 class="text-lg font-bold tracking-tight text-white">Vectra<span class="text-emerald-400">Edge</span></h1>
      </div>
      <div class="text-right leading-tight">
        <div id="live-date" class="text-[11px] font-semibold text-white"></div>
        <div id="live-clock" class="text-[10px] text-emerald-400 font-mono"></div>
      </div>
    </div>

    <div class="max-w-md mx-auto mt-2.5 grid grid-cols-4 gap-1.5 text-xs">
      <select id="filter-year" onchange="onCascadeChange('year')" class="bg-[#131722] border border-[#1e2536] text-white rounded-lg px-2 py-1.5 focus:outline-none">
        <option value="ALL">All Yrs</option>
      </select>
      <select id="filter-month" onchange="onCascadeChange('month')" class="bg-[#131722] border border-[#1e2536] text-white rounded-lg px-2 py-1.5 focus:outline-none">
        <option value="ALL">All Mos</option>
      </select>
      <select id="filter-day" onchange="renderAll()" class="bg-[#131722] border border-[#1e2536] text-white rounded-lg px-2 py-1.5 focus:outline-none">
        <option value="ALL">All Days</option>
      </select>
      <button onclick="resetDateFilter()" class="bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 font-semibold rounded-lg px-2 py-1.5">Live All</button>
    </div>

    <nav class="max-w-md mx-auto mt-2.5 grid grid-cols-3 text-center text-[11px] border-b border-[#1e2536]">
      <button id="tab-fno" onclick="switchTab('fno')" class="py-2 tab-active flex flex-col items-center justify-center gap-0.5">
        <span>Options (<span id="fno-total">0</span>)</span>
        <span class="text-[10px] font-semibold"><span id="fno-profit" class="text-emerald-400">0</span> <span class="text-slate-600">/</span> <span id="fno-loss" class="text-rose-400">0</span></span>
      </button>
      <button id="tab-stocks" onclick="switchTab('stocks')" class="py-2 tab-inactive flex flex-col items-center justify-center gap-0.5">
        <span>Stocks (<span id="stk-total">0</span>)</span>
        <span class="text-[10px] font-semibold"><span id="stk-profit" class="text-emerald-400">0</span> <span class="text-slate-600">/</span> <span id="stk-loss" class="text-rose-400">0</span></span>
      </button>
      <button id="tab-trades" onclick="switchTab('trades')" class="py-2 tab-inactive flex flex-col items-center justify-center gap-0.5">
        <span>Trades (<span id="trd-total">0</span>)</span>
        <span class="text-[10px] font-semibold"><span id="trd-live" class="text-emerald-400">0</span> <span class="text-slate-600">/</span> <span id="trd-closed" class="text-rose-400">0</span></span>
      </button>
    </nav>
  </header>

  <!-- 5 Index Sub-Tabs inside Options -->
  <div id="fno-filters" class="max-w-md mx-auto px-4 pt-3 flex gap-1.5 overflow-x-auto text-xs">
    <button onclick="setIndexMode('NIFTY')" id="idx-NIFTY" class="py-1.5 px-2.5 rounded-xl subtab-active flex items-center justify-center gap-1 shrink-0">
      <span>NIFTY</span>
      <span id="best-NIFTY" class="px-1.5 py-0.5 rounded bg-black/25 text-[10px] font-extrabold">--%</span>
    </button>
    <button onclick="setIndexMode('BANKNIFTY')" id="idx-BANKNIFTY" class="py-1.5 px-2.5 rounded-xl subtab-inactive flex items-center justify-center gap-1 shrink-0">
      <span>BANKNIFTY</span>
      <span id="best-BANKNIFTY" class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 text-[10px] font-extrabold">--%</span>
    </button>
    <button onclick="setIndexMode('SENSEX')" id="idx-SENSEX" class="py-1.5 px-2.5 rounded-xl subtab-inactive flex items-center justify-center gap-1 shrink-0">
      <span>SENSEX</span>
      <span id="best-SENSEX" class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 text-[10px] font-extrabold">--%</span>
    </button>
    <button onclick="setIndexMode('FINNIFTY')" id="idx-FINNIFTY" class="py-1.5 px-2.5 rounded-xl subtab-inactive flex items-center justify-center gap-1 shrink-0">
      <span>FINNIFTY</span>
      <span id="best-FINNIFTY" class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 text-[10px] font-extrabold">--%</span>
    </button>
    <button onclick="setIndexMode('MIDCPNIFTY')" id="idx-MIDCPNIFTY" class="py-1.5 px-2.5 rounded-xl subtab-inactive flex items-center justify-center gap-1 shrink-0">
      <span>MIDCPNIFTY</span>
      <span id="best-MIDCPNIFTY" class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 text-[10px] font-extrabold">--%</span>
    </button>
  </div>

  <!-- Stock Sub-Tabs -->
  <div id="stock-filters" class="hidden max-w-md mx-auto px-4 pt-3 flex gap-2">
    <button onclick="setStockMode('ALL')" id="flt-ALL" class="px-3 py-1 rounded-full text-xs bg-emerald-500 text-black font-semibold">All Stocks</button>
    <button onclick="setStockMode('Intraday')" id="flt-Intraday" class="px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536]">Intraday</button>
    <button onclick="setStockMode('Long/Swing')" id="flt-Long/Swing" class="px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536]">Long / Swing</button>
  </div>

  <main id="swipe-area" class="max-w-md mx-auto px-4 pt-3 space-y-3 min-h-[65vh]">
    <div id="main-list" class="space-y-3">
      <div class="text-center py-12 text-slate-400 text-sm">Loading fast market setups...</div>
    </div>
  </main>

  <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center">
    <div class="bg-[#131722] border-t sm:border border-[#2a3449] w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-[#1e2536] pb-3">
        <div>
          <h2 id="modal-title" class="text-base font-bold text-white">NIFTY 24650 CE</h2>
          <p id="modal-sub" class="text-xs text-emerald-400">Profit Chance: 82% | Loss Chance: 18%</p>
        </div>
        <button onclick="closeModal()" class="px-2.5 py-1 rounded-lg bg-[#1e2536] text-slate-300 text-xs">Close</button>
      </div>

      <div class="mt-3 bg-[#0b0e14] rounded-xl p-3 border border-[#1e2536]">
        <div class="flex justify-between text-[10px] text-slate-400 mb-2">
          <span>EMA 20/50 - VWAP - RSI (14) - BB</span>
          <span class="text-emerald-400">15m Live View</span>
        </div>
        <canvas id="signal-chart" height="100" class="w-full"></canvas>
      </div>

      <div id="modal-lot-box" class="mt-3 bg-[#0b0e14] p-3 rounded-xl border border-[#1e2536] flex items-center justify-between gap-2 text-xs"></div>

      <div id="modal-pnl" class="mt-3 grid grid-cols-2 gap-2 text-xs"></div>

      <div id="selected-strategy-box" class="hidden mt-3 bg-[#0b0e14] border border-emerald-500/40 rounded-xl p-3 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-[10px] uppercase tracking-wider text-emerald-400 font-bold">Selected Strategy View</span>
          <button onclick="clearSelectedStrategy()" class="text-[11px] text-slate-400">All 5</button>
        </div>
        <div id="selected-strategy-content" class="text-xs space-y-1.5"></div>
      </div>

      <div id="modal-strats-section" class="mt-3">
        <div class="text-xs font-bold text-white mb-2">5 Option Strategies (Tap any strategy for separate view)</div>
        <div id="modal-legs" class="space-y-2"></div>
      </div>

      <button id="accept-btn" onclick="acceptCurrentSignal()"
        class="mt-4 w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm transition">
        Accept and Log to My Trades
      </button>
    </div>
  </div>

  <script>
    const TABS = ['fno', 'stocks', 'trades'];
    const INDEX_TABS = ['NIFTY', 'BANKNIFTY', 'SENSEX', 'FINNIFTY', 'MIDCPNIFTY'];
    const CACHE_KEY = 'vectra_signals_cache_v2';
    let allSignals = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
    let currentTab = 'fno';
    let indexMode = 'NIFTY';
    let stockMode = 'ALL';
    let selectedSignal = null;
    let activeStrategy = null;
    let qtyMap = {};
    let myTrades = JSON.parse(localStorage.getItem('vectra_trades') || '[]').map(t => Object.assign({ status: 'LIVE' }, t));

    function getSigKey(s) {
      return (s.symbol || 'SIG') + '|' + (s.date || '');
    }

    function getUnits(s) {
      const k = getSigKey(s);
      return Math.max(1, parseInt(qtyMap[k] || 1, 10) || 1);
    }

    function changeUnits(e, key, delta) {
      if (e) e.stopPropagation();
      const cur = Math.max(1, parseInt(qtyMap[key] || 1, 10) || 1);
      qtyMap[key] = Math.max(1, cur + delta);
      renderAll();
      if (selectedSignal && getSigKey(selectedSignal) === key) {
        refreshModalDynamic(selectedSignal);
      }
    }

    function setUnitsDirect(e, key, val) {
      if (e) e.stopPropagation();
      qtyMap[key] = Math.max(1, parseInt(val || 1, 10) || 1);
      renderAll();
      if (selectedSignal && getSigKey(selectedSignal) === key) {
        refreshModalDynamic(selectedSignal);
      }
    }

    function calcInvestment(s, units) {
      const lotSize = s.is_fno ? (s.lot_size || 1) : 1;
      const totalQty = units * lotSize;
      const price = parseFloat(s.entry) || parseFloat(s.ltp) || 100;
      return {
        totalQty,
        investAmt: Math.round(totalQty * price)
      };
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('live-date').textContent = now.toLocaleDateString('en-IN', {
        weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'
      });
      document.getElementById('live-clock').textContent = now.toLocaleTimeString('en-IN', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    function initCascade() {
      const now = new Date();
      const curY = now.getFullYear();
      const curM = String(now.getMonth() + 1).padStart(2, '0');
      const curD = String(now.getDate()).padStart(2, '0');

      const ySel = document.getElementById('filter-year');
      ySel.innerHTML = '<option value="ALL">All Yrs</option>' + [curY, curY - 1].map(y => '<option value="' + y + '">' + y + '</option>').join('');

      const mSel = document.getElementById('filter-month');
      const months = ['01-Jan','02-Feb','03-Mar','04-Apr','05-May','06-Jun','07-Jul','08-Aug','09-Sep','10-Oct','11-Nov','12-Dec'];
      mSel.innerHTML = '<option value="ALL">All Mos</option>' + months.map(m => '<option value="' + m.slice(0,2) + '">' + m + '</option>').join('');

      const dSel = document.getElementById('filter-day');
      let dOpts = '<option value="ALL">All Days</option>';
      for (let d = 1; d <= 31; d++) {
        const dd = String(d).padStart(2, '0');
        dOpts += '<option value="' + dd + '">' + dd + '</option>';
      }
      dSel.innerHTML = dOpts;

      ySel.value = 'ALL';
      mSel.value = 'ALL';
      dSel.value = 'ALL';
      window._todayKey = curY + '-' + curM + '-' + curD;
    }

    function onCascadeChange(level) {
      if (level === 'year') {
        document.getElementById('filter-month').value = 'ALL';
        document.getElementById('filter-day').value = 'ALL';
      } else if (level === 'month') {
        document.getElementById('filter-day').value = 'ALL';
      }
      renderAll();
    }

    function resetDateFilter() {
      document.getElementById('filter-year').value = 'ALL';
      document.getElementById('filter-month').value = 'ALL';
      document.getElementById('filter-day').value = 'ALL';
      renderAll();
    }

    const DEFAULT_FNO_SETUPS = [
      { symbol: "NIFTY 25250 CE", is_fno: true, side: "BUY", ltp: 142.50, win_prob: 84, loss_prob: 16, entry: 143.50, target: 185.00, sl: 122.00, lot_size: 75 },
      { symbol: "NIFTY 25250 PE", is_fno: true, side: "BUY", ltp: 118.00, win_prob: 71, loss_prob: 29, entry: 119.50, target: 152.00, sl: 102.00, lot_size: 75 },
      { symbol: "NIFTY 25300 CE", is_fno: true, side: "BUY", ltp: 109.00, win_prob: 66, loss_prob: 34, entry: 110.00, target: 138.00, sl: 95.00, lot_size: 75 },
      { symbol: "BANKNIFTY 52400 PE", is_fno: true, side: "BUY", ltp: 210.00, win_prob: 79, loss_prob: 21, entry: 212.00, target: 275.00, sl: 180.00, lot_size: 30 },
      { symbol: "BANKNIFTY 52400 CE", is_fno: true, side: "BUY", ltp: 196.00, win_prob: 68, loss_prob: 32, entry: 198.00, target: 248.00, sl: 172.00, lot_size: 30 },
      { symbol: "SENSEX 81200 CE", is_fno: true, side: "BUY", ltp: 265.00, win_prob: 76, loss_prob: 24, entry: 268.00, target: 345.00, sl: 228.00, lot_size: 20 },
      { symbol: "SENSEX 81200 PE", is_fno: true, side: "BUY", ltp: 234.00, win_prob: 63, loss_prob: 37, entry: 236.00, target: 292.00, sl: 205.00, lot_size: 20 },
      { symbol: "FINNIFTY 24100 CE", is_fno: true, side: "BUY", ltp: 128.00, win_prob: 75, loss_prob: 25, entry: 129.50, target: 164.00, sl: 111.00, lot_size: 65 },
      { symbol: "FINNIFTY 24100 PE", is_fno: true, side: "BUY", ltp: 106.00, win_prob: 61, loss_prob: 39, entry: 107.50, target: 135.00, sl: 92.00, lot_size: 65 },
      { symbol: "MIDCPNIFTY 12850 CE", is_fno: true, side: "BUY", ltp: 94.00, win_prob: 73, loss_prob: 27, entry: 95.00, target: 122.00, sl: 81.00, lot_size: 120 },
      { symbol: "MIDCPNIFTY 12850 PE", is_fno: true, side: "BUY", ltp: 82.00, win_prob: 59, loss_prob: 41, entry: 83.00, target: 105.00, sl: 71.00, lot_size: 120 }
    ];

    function buildStrategiesForSignal(s, totalQty) {
      const baseP = Math.round(Math.abs((s.target - s.entry) * totalQty));
      const baseL = Math.round(Math.abs((s.entry - s.sl) * totalQty));
      const pPct = s.win_prob || 72;
      const lPct = 100 - pPct;
      const parts = (s.symbol || 'NIFTY 25000 CE').split(' ');
      const idxName = parts[0] || 'INDEX';
      const strike = parseInt(parts[1], 10) || 25000;
      const step = idxName.includes('BANK') || idxName.includes('SENSEX') ? 100 : (idxName.includes('MIDCP') ? 25 : 50);

      return [
        {
          id: "straddle",
          name: "1. Dual Straddle (ATM CE + PE)",
          desc: "Big move on either side - " + strike + " CE & PE",
          legs: strike + " CE + " + strike + " PE",
          winPct: pPct,
          lossPct: lPct,
          profitAmt: Math.round(baseP * 1.35),
          lossAmt: Math.round(baseL * 1.15)
        },
        {
          id: "strangle",
          name: "2. OTM Strangle (CE + PE)",
          desc: "Lower cost breakout - " + (strike + step) + " CE & " + (strike - step) + " PE",
          legs: (strike + step) + " CE + " + (strike - step) + " PE",
          winPct: Math.min(89, pPct - 4),
          lossPct: Math.max(11, 100 - Math.min(89, pPct - 4)),
          profitAmt: Math.round(baseP * 1.15),
          lossAmt: Math.round(baseL * 0.85)
        },
        {
          id: "bull_spread",
          name: "3. Bull Call Spread",
          desc: "Buy " + strike + " CE + Sell " + (strike + step * 2) + " CE (Capped risk)",
          legs: "BUY " + strike + " CE / SELL " + (strike + step * 2) + " CE",
          winPct: Math.min(90, pPct + 3),
          lossPct: Math.max(10, 100 - Math.min(90, pPct + 3)),
          profitAmt: Math.round(baseP * 0.90),
          lossAmt: Math.round(baseL * 0.55)
        },
        {
          id: "bear_spread",
          name: "4. Bear Put Spread",
          desc: "Buy " + strike + " PE + Sell " + (strike - step * 2) + " PE (Downside hedge)",
          legs: "BUY " + strike + " PE / SELL " + (strike - step * 2) + " PE",
          winPct: Math.max(52, 96 - pPct),
          lossPct: Math.min(48, 100 - Math.max(52, 96 - pPct)),
          profitAmt: Math.round(baseP * 0.88),
          lossAmt: Math.round(baseL * 0.52)
        },
        {
          id: "condor",
          name: "5. Range / Iron Condor Hedge",
          desc: "Theta decay play - " + (strike - step * 2) + " PE to " + (strike + step * 2) + " CE",
          legs: (strike - step * 2) + " PE <-> " + (strike + step * 2) + " CE",
          winPct: 67,
          lossPct: 33,
          profitAmt: Math.round(baseP * 0.75),
          lossAmt: Math.round(baseL * 0.65)
        }
      ];
    }

    function detectIndexName(sym) {
      const u = (sym || '').toUpperCase().trim();
      if (u.startsWith('BANKNIFTY ') || u.includes('BANKNIFTY')) return 'BANKNIFTY';
      if (u.startsWith('MIDCPNIFTY ') || u.includes('MIDCPNIFTY')) return 'MIDCPNIFTY';
      if (u.startsWith('FINNIFTY ') || u.includes('FINNIFTY')) return 'FINNIFTY';
      if (u.startsWith('SENSEX ') || u.includes('SENSEX')) return 'SENSEX';
      if (u.startsWith('NIFTY ') || u.includes('NIFTY')) return 'NIFTY';
      return null;
    }

    function normalizeSignal(raw) {
      const s = Object.assign({}, raw);
      const nameUpper = (s.symbol || '').toUpperCase();
      const idx = detectIndexName(nameUpper);
      s.is_fno = Boolean(s.is_fno || idx || nameUpper.includes(' CE') || nameUpper.includes(' PE'));
      s.index_name = idx;
      s.date = s.date || window._todayKey || '2026-11-19';

      const entry = parseFloat(s.entry) || parseFloat(s.ltp) || 100;
      let target = parseFloat(s.target) || entry * 1.03;
      let sl = parseFloat(s.sl) || entry * 0.985;
      const diffT = Math.abs(target - entry) || Math.max(1.5, entry * 0.025);
      const diffSL = Math.abs(entry - sl) || Math.max(0.8, entry * 0.012);

      if ((s.side || 'BUY').toUpperCase() === 'SELL') {
        s.side = 'SELL';
        s.target = Number((entry - diffT).toFixed(2));
        s.sl = Number((entry + diffSL).toFixed(2));
      } else {
        s.side = 'BUY';
        s.target = Number((entry + diffT).toFixed(2));
        s.sl = Number((entry - diffSL).toFixed(2));
      }
      s.entry = Number(entry.toFixed(2));
      return s;
    }

    async function fetchSignals() {
      try {
        const res = await fetch('/api/signals');
        const data = await res.json();
        const rawList = Array.isArray(data) ? data : (data.signals || data.candidates || []);
        if (rawList.length) {
          allSignals = rawList.map(normalizeSignal);
          localStorage.setItem(CACHE_KEY, JSON.stringify(allSignals));
        }
      } catch (e) {
        console.error(e);
      }
      renderAll();
    }

    function switchTab(tab) {
      if (!TABS.includes(tab)) return;
      currentTab = tab;
      TABS.forEach(t => {
        document.getElementById('tab-' + t).className = (t === tab)
          ? 'py-2 tab-active flex flex-col items-center justify-center gap-0.5'
          : 'py-2 tab-inactive flex flex-col items-center justify-center gap-0.5';
      });
      document.getElementById('fno-filters').classList.toggle('hidden', tab !== 'fno');
      document.getElementById('stock-filters').classList.toggle('hidden', tab !== 'stocks');
      renderAll();
    }

    function setIndexMode(idxName) {
      indexMode = idxName;
      INDEX_TABS.forEach(name => {
        const btn = document.getElementById('idx-' + name);
        const badge = document.getElementById('best-' + name);
        const active = (name === idxName);
        btn.className = 'py-1.5 px-2.5 rounded-xl flex items-center justify-center gap-1 shrink-0 ' + (active ? 'subtab-active' : 'subtab-inactive');
        badge.className = 'px-1.5 py-0.5 rounded text-[10px] font-extrabold ' + (active ? 'bg-black/25 text-white' : 'bg-emerald-500/15 text-emerald-400');
      });
      renderAll();
    }

    let touchStartX = 0;
    let touchStartY = 0;
    const swipeEl = document.getElementById('swipe-area');
    swipeEl.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });
    swipeEl.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        const idx = TABS.indexOf(currentTab);
        if (dx < 0 && idx < TABS.length - 1) {
          switchTab(TABS[idx + 1]);
        } else if (dx > 0 && idx > 0) {
          switchTab(TABS[idx - 1]);
        }
      }
    }, { passive: true });

    function setStockMode(mode) {
      stockMode = mode;
      ['ALL', 'Intraday', 'Long/Swing'].forEach(m => {
        const el = document.getElementById('flt-' + m);
        el.className = (m === mode)
          ? 'px-3 py-1 rounded-full text-xs bg-emerald-500 text-black font-semibold'
          : 'px-3 py-1 rounded-full text-xs bg-[#131722] text-slate-300 border border-[#1e2536]';
      });
      renderAll();
    }

    function matchesCascadeDate(dStr) {
      const y = document.getElementById('filter-year').value;
      const m = document.getElementById('filter-month').value;
      const d = document.getElementById('filter-day').value;
      const parts = (dStr || window._todayKey || '').split('-');
      if (y !== 'ALL' && parts[0] !== y) return false;
      if (m !== 'ALL' && parts[1] !== m) return false;
      if (d !== 'ALL' && parts[2] !== d) return false;
      return true;
    }

    function getAllFnoPool() {
      const dateFiltered = allSignals.filter(s => s.is_fno && matchesCascadeDate(s.date));
      const base = dateFiltered.length ? dateFiltered : DEFAULT_FNO_SETUPS.map(normalizeSignal).filter(s => matchesCascadeDate(s.date));
      return base.filter(s => INDEX_TABS.includes(s.index_name || detectIndexName(s.symbol)));
    }

    function getTabList(tabName) {
      if (tabName === 'fno') {
        return getAllFnoPool()
          .filter(s => (s.index_name || detectIndexName(s.symbol)) === indexMode)
          .sort((a, b) => (b.win_prob || 0) - (a.win_prob || 0));
      }
      let list = allSignals.filter(s => !s.is_fno && matchesCascadeDate(s.date));
      if (stockMode !== 'ALL') {
        list = list.filter(s => (s.symbol || '').includes(stockMode));
      }
      return list.sort((a, b) => (b.win_prob || 0) - (a.win_prob || 0));
    }

    function updateBestIndexBadges() {
      const pool = getAllFnoPool();
      INDEX_TABS.forEach(name => {
        const items = pool.filter(s => (s.index_name || detectIndexName(s.symbol)) === name);
        const bestEl = document.getElementById('best-' + name);
        if (!items.length) {
          bestEl.textContent = '--%';
          return;
        }
        const maxProb = Math.max.apply(null, items.map(x => x.win_prob || 0));
        bestEl.textContent = maxProb + '%';
      });
    }

    function updateHeaderCounts() {
      updateBestIndexBadges();
      const fnoList = getAllFnoPool();
      const stkList = getTabList('stocks');

      const fnoP = fnoList.filter(s => (s.win_prob || 0) >= (s.loss_prob ?? (100 - (s.win_prob || 0)))).length;
      const fnoL = fnoList.length - fnoP;
      document.getElementById('fno-total').textContent = fnoList.length;
      document.getElementById('fno-profit').textContent = fnoP;
      document.getElementById('fno-loss').textContent = fnoL;

      const stkP = stkList.filter(s => (s.win_prob || 0) >= (s.loss_prob ?? (100 - (s.win_prob || 0)))).length;
      const stkL = stkList.length - stkP;
      document.getElementById('stk-total').textContent = stkList.length;
      document.getElementById('stk-profit').textContent = stkP;
      document.getElementById('stk-loss').textContent = stkL;

      const liveCnt = myTrades.filter(t => t.status !== 'CLOSED').length;
      const closedCnt = myTrades.filter(t => t.status === 'CLOSED').length;
      document.getElementById('trd-total').textContent = myTrades.length;
      document.getElementById('trd-live').textContent = liveCnt;
      document.getElementById('trd-closed').textContent = closedCnt;
    }

    function renderAll() {
      updateHeaderCounts();
      const container = document.getElementById('main-list');

      if (currentTab === 'trades') {
        if (!myTrades.length) {
          container.innerHTML = '<div class="card-bg rounded-xl p-6 text-center text-slate-400 text-sm">No trades logged yet. Tap any signal to accept and track live.</div>';
          return;
        }
        const totalPnl = myTrades.reduce((acc, t) => acc + (t.estPnl || 0), 0);
        container.innerHTML =
          '<div class="card-bg rounded-xl p-3 flex justify-between items-center">' +
            '<span class="text-xs text-slate-400">EOD Projected Net P&L</span>' +
            '<span class="text-base font-bold ' + (totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400') + '">' + (totalPnl >= 0 ? '+' : '') + '₹' + totalPnl.toLocaleString('en-IN') + '</span>' +
          '</div>' +
          myTrades.map((t, idx) => {
            const isClosed = t.status === 'CLOSED';
            return '<div class="card-bg rounded-xl p-3.5 space-y-1.5">' +
              '<div class="flex justify-between items-center">' +
                '<div class="flex items-center gap-2">' +
                  '<span class="font-bold text-white text-sm">' + t.cleanName + '</span>' +
                  '<span class="px-2 py-0.5 rounded text-[10px] font-bold ' + (isClosed ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400') + '">' + (isClosed ? 'CLOSED' : 'LIVE') + '</span>' +
                '</div>' +
                (!isClosed ? '<button onclick="closeTrade(' + idx + ')" class="text-[11px] px-2 py-0.5 rounded bg-rose-500/15 text-rose-400 font-semibold">Close Trade</button>' : '') +
              '</div>' +
              '<div class="text-xs text-slate-300 flex justify-between">' +
                '<span>Entry: ₹' + t.entry + '</span>' +
                '<span class="text-emerald-400">Target: ₹' + t.target + '</span>' +
                '<span class="text-rose-400">SL: ₹' + t.sl + '</span>' +
              '</div>' +
              (t.investAmt ? '<div class="text-[11px] text-amber-300">Investment: ₹' + t.investAmt.toLocaleString('en-IN') + ' (' + t.units + (t.isFno ? ' Lot' : ' Qty') + ')</div>' : '') +
            '</div>';
          }).join('');
        return;
      }

      const filtered = getTabList(currentTab);

      if (!filtered.length) {
        container.innerHTML = '<div class="card-bg rounded-xl p-6 text-center text-slate-400 text-sm">No setups match this filter right now. Tap "Live All" to view all.</div>';
        return;
      }

      container.innerHTML = filtered.map((s, i) => {
        const key = getSigKey(s);
        const units = getUnits(s);
        const { totalQty, investAmt } = calcInvestment(s, units);
        const win = s.win_prob || 68;
        const loss = s.loss_prob || (100 - win);
        const cleanName = (s.symbol || '').split('(')[0].trim();
        const maxProfit = Math.round(Math.abs((s.target - s.entry) * totalQty));
        const maxLoss = Math.round(Math.abs((s.entry - s.sl) * totalQty));
        const unitLabel = s.is_fno ? 'Lots' : 'Qty';

        return '<div onclick=\'openModal(' + JSON.stringify(s).replace(/'/g, "&#39;") + ')\' class="card-bg rounded-xl p-3.5 active:scale-[0.99] transition cursor-pointer">' +
          '<div class="flex items-start justify-between gap-2">' +
            '<div>' +
              '<div class="flex items-center gap-1.5">' +
                '<span class="text-xs font-bold px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400">#' + (i + 1) + '</span>' +
                '<h3 class="font-bold text-white text-sm">' + cleanName + '</h3>' +
              '</div>' +
              '<div class="mt-1 flex items-center gap-2 text-xs font-semibold">' +
                '<span class="text-emerald-400">Profit: ' + win + '% (+₹' + maxProfit.toLocaleString('en-IN') + ')</span>' +
                '<span class="text-slate-600">|</span>' +
                '<span class="text-rose-400">Loss: ' + loss + '% (-₹' + maxLoss.toLocaleString('en-IN') + ')</span>' +
              '</div>' +
            '</div>' +
            '<div class="text-right">' +
              '<span class="px-2 py-0.5 rounded text-[11px] font-bold ' + (s.side === 'SELL' ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400') + '">' + s.side + '</span>' +
              '<div class="text-xs text-slate-300 mt-1">LTP ₹' + s.ltp + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="mt-3 grid grid-cols-3 gap-2 bg-[#0b0e14] rounded-lg p-2 text-center text-xs">' +
            '<div><div class="text-[10px] text-slate-400">Entry</div><div class="font-semibold text-white">₹' + s.entry + '</div></div>' +
            '<div><div class="text-[10px] text-slate-400">Target</div><div class="font-semibold text-emerald-400">₹' + s.target + '</div></div>' +
            '<div><div class="text-[10px] text-slate-400">Stop Loss</div><div class="font-semibold text-rose-400">₹' + s.sl + '</div></div>' +
          '</div>' +
          '<div onclick="event.stopPropagation()" class="mt-2.5 flex items-center justify-between gap-2 bg-[#0b0e14] rounded-lg px-2.5 py-2 border border-[#1e2536] text-xs">' +
            '<div class="flex items-center gap-1.5">' +
              '<span class="text-slate-400 text-[11px]">' + unitLabel + ':</span>' +
              '<button onclick="changeUnits(event, \'' + key.replace(/'/g, "\\'") + '\', -1)" class="w-6 h-6 rounded bg-[#1e2536] text-white font-bold">-</button>' +
              '<input type="number" min="1" value="' + units + '" onchange="setUnitsDirect(event, \'' + key.replace(/'/g, "\\'") + '\', this.value)" class="w-11 text-center bg-[#131722] border border-[#2a3449] rounded py-0.5 text-white font-bold" />' +
              '<button onclick="changeUnits(event, \'' + key.replace(/'/g, "\\'") + '\', 1)" class="w-6 h-6 rounded bg-emerald-500/20 text-emerald-400 font-bold">+</button>' +
            '</div>' +
            '<div class="text-right">' +
              '<div class="text-[10px] text-slate-400">Investment (' + totalQty + ' qty)</div>' +
              '<div class="font-bold text-amber-300">₹' + investAmt.toLocaleString('en-IN') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="mt-2 flex justify-between text-[11px] text-slate-300">' +
            '<span>Max Profit: <strong class="text-emerald-400">+₹' + maxProfit.toLocaleString('en-IN') + '</strong></span>' +
            '<span>Max Loss: <strong class="text-rose-400">-₹' + maxLoss.toLocaleString('en-IN') + '</strong></span>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function refreshModalDynamic(s) {
      const key = getSigKey(s);
      const units = getUnits(s);
      const { totalQty, investAmt } = calcInvestment(s, units);
      const win = s.win_prob || 68;
      const loss = s.loss_prob || (100 - win);
      const maxP = Math.round(Math.abs((s.target - s.entry) * totalQty));
      const maxL = Math.round(Math.abs((s.entry - s.sl) * totalQty));
      const unitLabel = s.is_fno ? 'Lots' : 'Qty';

      document.getElementById('modal-sub').textContent = 'Profit ' + win + '% (+₹' + maxP.toLocaleString('en-IN') + ') | Loss ' + loss + '% (-₹' + maxL.toLocaleString('en-IN') + ') - LTP ₹' + s.ltp;

      document.getElementById('modal-lot-box').innerHTML =
        '<div class="flex items-center gap-1.5">' +
          '<span class="text-slate-400">' + unitLabel + ':</span>' +
          '<button onclick="changeUnits(event, \'' + key.replace(/'/g, "\\'") + '\', -1)" class="w-7 h-7 rounded bg-[#1e2536] text-white font-bold">-</button>' +
          '<input type="number" min="1" value="' + units + '" onchange="setUnitsDirect(event, \'' + key.replace(/'/g, "\\'") + '\', this.value)" class="w-12 text-center bg-[#131722] border border-[#2a3449] rounded py-1 text-white font-bold" />' +
          '<button onclick="changeUnits(event, \'' + key.replace(/'/g, "\\'") + '\', 1)" class="w-7 h-7 rounded bg-emerald-500/20 text-emerald-400 font-bold">+</button>' +
        '</div>' +
        '<div class="text-right">' +
          '<div class="text-[10px] text-slate-400">Investment Needed (' + totalQty + ' qty)</div>' +
          '<div class="text-sm font-bold text-amber-300">₹' + investAmt.toLocaleString('en-IN') + '</div>' +
        '</div>';

      document.getElementById('modal-pnl').innerHTML =
        '<div class="bg-[#0b0e14] p-2.5 rounded-lg border border-[#1e2536]">' +
          '<div class="text-[10px] text-slate-400">Max Profit (' + win + '%)</div>' +
          '<div class="text-sm font-bold text-emerald-400">+₹' + maxP.toLocaleString('en-IN') + '</div>' +
        '</div>' +
        '<div class="bg-[#0b0e14] p-2.5 rounded-lg border border-[#1e2536]">' +
          '<div class="text-[10px] text-slate-400">Max Loss (' + loss + '%)</div>' +
          '<div class="text-sm font-bold text-rose-400">-₹' + maxL.toLocaleString('en-IN') + '</div>' +
        '</div>';

      const stratsSection = document.getElementById('modal-strats-section');
      if (s.is_fno) {
        stratsSection.classList.remove('hidden');
        const strats = buildStrategiesForSignal(s, totalQty);
        window._currentStrats = strats;
        document.getElementById('modal-legs').innerHTML = strats.map((st, idx) =>
          '<div onclick="selectStrategy(' + idx + ')" class="bg-[#0b0e14] hover:border-emerald-500/50 p-2.5 rounded-lg border border-[#1e2536] space-y-1 text-xs cursor-pointer transition">' +
            '<div class="flex justify-between items-center">' +
              '<span class="font-bold text-white">' + st.name + '</span>' +
              '<span class="text-[11px] font-semibold">' +
                '<span class="text-emerald-400">' + st.winPct + '% (+₹' + st.profitAmt.toLocaleString('en-IN') + ')</span>' +
                '<span class="text-slate-600"> | </span>' +
                '<span class="text-rose-400">' + st.lossPct + '% (-₹' + st.lossAmt.toLocaleString('en-IN') + ')</span>' +
              '</span>' +
            '</div>' +
            '<div class="text-[11px] text-slate-400">' + st.desc + '</div>' +
          '</div>'
        ).join('');
      } else {
        stratsSection.classList.add('hidden');
      }
    }

    function openModal(s) {
      selectedSignal = s;
      activeStrategy = null;
      document.getElementById('selected-strategy-box').classList.add('hidden');
      document.getElementById('modal-title').textContent = (s.symbol || '').split('(')[0].trim();
      refreshModalDynamic(s);
      document.getElementById('detail-modal').classList.remove('hidden');
      drawChart(s.ltp || 100);
    }

    function selectStrategy(idx) {
      const st = (window._currentStrats || [])[idx];
      if (!st || !selectedSignal) return;
      activeStrategy = st;
      document.getElementById('selected-strategy-box').classList.remove('hidden');
      document.getElementById('selected-strategy-content').innerHTML =
        '<div class="font-bold text-white text-sm">' + st.name + '</div>' +
        '<div class="text-slate-300">Legs: <strong class="text-white">' + st.legs + '</strong></div>' +
        '<div class="text-slate-400">' + st.desc + '</div>' +
        '<div class="grid grid-cols-2 gap-2 pt-1">' +
          '<div class="bg-[#131722] p-2 rounded-lg">' +
            '<div class="text-[10px] text-slate-400">Profit (' + st.winPct + '%)</div>' +
            '<div class="font-bold text-emerald-400">+₹' + st.profitAmt.toLocaleString('en-IN') + '</div>' +
          '</div>' +
          '<div class="bg-[#131722] p-2 rounded-lg">' +
            '<div class="text-[10px] text-slate-400">Loss (' + st.lossPct + '%)</div>' +
            '<div class="font-bold text-rose-400">-₹' + st.lossAmt.toLocaleString('en-IN') + '</div>' +
          '</div>' +
        '</div>';
    }

    function clearSelectedStrategy() {
      activeStrategy = null;
      document.getElementById('selected-strategy-box').classList.add('hidden');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function acceptCurrentSignal() {
      if (!selectedSignal) return;
      const units = getUnits(selectedSignal);
      const { totalQty, investAmt } = calcInvestment(selectedSignal, units);
      const baseName = (selectedSignal.symbol || '').split('(')[0].trim();
      const label = activeStrategy ? (baseName + ' - ' + activeStrategy.name) : baseName;
      const estPnl = activeStrategy ? activeStrategy.profitAmt : Math.round(Math.abs((selectedSignal.target - selectedSignal.entry) * totalQty));
      myTrades.unshift({
        cleanName: label,
        entry: selectedSignal.entry,
        target: selectedSignal.target,
        sl: selectedSignal.sl,
        units,
        isFno: Boolean(selectedSignal.is_fno),
        investAmt,
        estPnl,
        status: 'LIVE'
      });
      localStorage.setItem('vectra_trades', JSON.stringify(myTrades));
      closeModal();
      switchTab('trades');
    }

    function closeTrade(idx) {
      if (myTrades[idx]) {
        myTrades[idx].status = 'CLOSED';
      }
      localStorage.setItem('vectra_trades', JSON.stringify(myTrades));
      renderAll();
    }

    function drawChart(base) {
      const c = document.getElementById('signal-chart');
      const ctx = c.getContext('2d');
      c.width = c.offsetWidth || 320;
      ctx.clearRect(0, 0, c.width, c.height);
      const bars = 24;
      const w = c.width / bars;
      let val = base * 0.985;
      for (let i = 0; i < bars; i++) {
        const delta = (Math.sin(i * 0.7) + (i / bars) * 0.8) * (base * 0.004);
        const open = val;
        const close = val + delta;
        val = close;
        const yOpen = c.height - ((open - base * 0.97) / (base * 0.05)) * c.height;
        const yClose = c.height - ((close - base * 0.97) / (base * 0.05)) * c.height;
        ctx.fillStyle = close >= open ? '#10b981' : '#f43f5e';
        ctx.fillRect(i * w + 3, Math.min(yOpen, yClose), w - 6, Math.max(4, Math.abs(yClose - yOpen)));
      }
    }

    initCascade();
    renderAll();
    fetchSignals();
    setInterval(fetchSignals, 30000);
  </script>
</body>
</html>
